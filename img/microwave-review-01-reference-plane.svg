<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">传输线参考面与传播方向</title>
<desc id="desc">负载在左侧，信号源在右侧。距离从负载向源增加，入射波和电流参考方向向左，反射波向右。计算顺序为负载阻抗、负载反射系数、移动后的反射系数、输入阻抗。</desc>
<defs>
 <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0d766e"/></marker>
 <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker>
 <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="470" rx="16" fill="#f5f8fb"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" fill="#172c3b">
 <text x="38" y="44" font-size="25" font-weight="700">先画方向，再代公式</text>
 <text x="38" y="76" font-size="17" fill="#526779">约定：时间因子 eʲωᵗ；距离从负载向源增加；电流正方向朝向负载</text>
 <path d="M148 182H838M148 246H838" stroke="#475569" stroke-width="3" fill="none"/>
 <rect x="130" y="182" width="36" height="64" rx="3" fill="#e7eef5" stroke="#475569" stroke-width="3"/>
 <text x="148" y="280" text-anchor="middle" font-size="20" font-weight="600">负载 ZL</text>
 <text x="148" y="310" text-anchor="middle" font-size="18" fill="#526779">l = 0</text>
 <circle cx="855" cy="214" r="36" fill="#fff" stroke="#475569" stroke-width="3"/>
 <path d="M834 214Q844 190 855 214T876 214" stroke="#475569" stroke-width="2.5" fill="none"/>
 <text x="855" y="280" text-anchor="middle" font-size="20" font-weight="600">信号源</text>
 <path d="M654 108V265" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
 <text x="672" y="126" font-size="17" fill="#526779">输入参考面</text>
 <text x="654" y="289" text-anchor="middle" font-size="18">从这里向左看：Zin(l)</text>
 <path d="M603 132H255" stroke="#0d766e" stroke-width="3" marker-end="url(#teal)"/>
 <text x="430" y="116" text-anchor="middle" font-size="19" fill="#0d766e">入射波、I 的正方向</text>
 <path d="M255 160H603" stroke="#b45309" stroke-width="3" marker-end="url(#amber)"/>
 <text x="430" y="213" text-anchor="middle" font-size="19" fill="#b45309">反射波</text>
 <path d="M180 326H788" stroke="#475569" stroke-width="2" marker-end="url(#ink)"/>
 <text x="486" y="353" text-anchor="middle" font-size="18" fill="#526779">向源移动 l：反射相位减少 2βl，模长保持不变（无耗线）</text>
 <g font-size="18" text-anchor="middle">
 <rect x="40" y="390" width="184" height="49" rx="8" fill="#e4eef8"/><text x="132" y="421">① 负载阻抗</text>
 <rect x="282" y="390" width="184" height="49" rx="8" fill="#e4eef8"/><text x="374" y="421">② 负载反射系数</text>
 <rect x="524" y="390" width="194" height="49" rx="8" fill="#dcefea"/><text x="621" y="421">③ 移动参考面</text>
 <rect x="776" y="390" width="184" height="49" rx="8" fill="#dcefea"/><text x="868" y="421">④ 输入阻抗</text>
 </g>
 <g stroke="#475569" stroke-width="2" marker-end="url(#ink)"><path d="M237 414H269"/><path d="M479 414H511"/><path d="M731 414H763"/></g>
</g>
</svg>
