<text x="35" y="45" font-size="27" fill="#2c2825" text-anchor="start" font-weight="bold">公式相同，边界不同：先看前一个样本是谁</text>
<text x="35" y="84" font-size="20" fill="#72695e" text-anchor="start" font-weight="normal">y[n] = (x[n] + x[n − 1]) / 2；保存的四点为 [1, c, 0, −c]，c = √2 / 2</text>
<text x="35" y="137" font-size="22" fill="#526b86" text-anchor="start" font-weight="bold">无限正弦输入</text>
<text x="370" y="137" font-size="19" fill="#72695e" text-anchor="start" font-weight="normal">x[−1] = c，x[4] = −1</text>
