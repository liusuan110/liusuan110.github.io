<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="925" viewBox="0 0 1050 925" role="img" aria-labelledby="title desc">
<title id="title">同一个滤波器的三种边界</title><desc id="desc">两点平均器处理无限正弦、零历史有限四点记录、四点周期输入时，编号0输出分别约0.854、0.5、0.146。三个图纵轴一致。最后一个图的编号4是下一周期首点。</desc>
