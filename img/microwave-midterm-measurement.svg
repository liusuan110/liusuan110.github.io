<text x="190.135" y="433.139" fill="#2563eb" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" text-anchor="start" font-weight="700">L</text>
<circle cx="200.000" cy="365.000" r="4.000" fill="#14796f" stroke="white" stroke-width="1"/>
<text x="212" y="357" fill="#14796f" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="start" font-weight="400">M：Γ = 0</text>
<circle cx="154.082" cy="409.991" r="4.500" fill="#c66a22" stroke="white" stroke-width="1.2"/>
<text x="137.082" y="428.991" fill="#c66a22" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" text-anchor="end" font-weight="700">A</text>
<circle cx="154.082" cy="320.009" r="4.500" fill="#c66a22" stroke="white" stroke-width="1.2"/>
<text x="137.082" y="310.009" fill="#c66a22" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" text-anchor="end" font-weight="700">B</text>
<line x1="305.000" y1="322.000" x2="326.000" y2="322.000" stroke="#2563eb" stroke-width="3"/>
<text x="334" y="327" fill="#2563eb" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="start" font-weight="400">沿线</text>
<line x1="305.000" y1="350.000" x2="326.000" y2="350.000" stroke="#c66a22" stroke-width="3"/>
<text x="334" y="355" fill="#c66a22" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="start" font-weight="400">加电纳</text>
<text x="305" y="389" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="start" font-weight="400">先 g = 1</text>
<text x="305" y="414" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="start" font-weight="400">再消电纳</text>
<text x="38" y="463" fill="#587080" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="start" font-weight="400">先沿等 |Γ| 圆旋转，再沿 g = 1 圆加支节电纳</text>
<line x1="484.000" y1="329.000" x2="866.000" y2="329.000" stroke="#183344" stroke-width="2.2"/>
<circle cx="652.000" cy="329.000" r="4.000" fill="#14796f" stroke="#14796f" stroke-width="1.2"/>
