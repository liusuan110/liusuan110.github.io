<line x1="640.000" y1="389.000" x2="664.000" y2="389.000" stroke="#183344" stroke-width="3"/>
<rect x="843" y="315" width="40" height="28" rx="3" fill="#ffffff" stroke="#183344"/>
<text x="863" y="334" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" font-weight="400">ZL</text>
<text x="490" y="307" fill="#14796f" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="start" font-weight="400">源侧 ρ = 1</text>
<text x="744" y="307" fill="#c66a22" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" font-weight="400">负载侧 ρ = 6</text>
<text x="639" y="309" fill="#14796f" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" text-anchor="middle" font-weight="700">J</text>
<text x="748" y="354" fill="#587080" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" font-weight="400">主线距离 d</text>
<text x="673" y="380" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="start" font-weight="400">短路支节 l_s</text>
<text x="479" y="422" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="start" font-weight="400">yJ = (1 ± j2.04124) + (∓j2.04124) = 1</text>
<text x="479" y="452" fill="#587080" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="start" font-weight="400">理想支节不耗有功；负载侧仍保留驻波</text>
<text x="26" y="505" fill="#587080" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="start" font-weight="400">匹配后功率取决于保持哪个参考面的入射波及信号源阻抗；原卷未给定这些新增条件。</text>
</svg>
