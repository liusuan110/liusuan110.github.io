<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
<title id="title">综合例M-1：驻波测量、负载反演与两组并联短路支节</title>
<desc id="desc">使用2022到2023期中原题的电压峰值6伏、1伏，相邻极大间距50毫米，首极小距负载10毫米。先恢复反射系数与负载，再新增两组同波长短路支节匹配。圆图上蓝色表示沿线旋转，橙色表示在同一结点加纯电纳。匹配后源侧驻波比1，负载侧驻波比仍为6；图示和新增追问不代表当前考试范围。</desc>
<rect x="0" y="0" width="920" height="520" rx="16" fill="#f5f8fb" stroke="none"/>
<defs>
<marker id="arrow-2563eb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker>
<marker id="arrow-c66a22" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c66a22"/></marker>
<marker id="arrow-587080" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#587080"/></marker>
</defs>
<text x="25" y="36" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" text-anchor="start" font-weight="700">综合例 M-1：测得驻波，怎样走到完整匹配方案</text>
<text x="26" y="66" fill="#587080" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="start" font-weight="400">原题：反演与平均功率；新增追问：支节匹配与源条件。电压均为峰值，距离从负载向源量。</text>
<rect x="20" y="88" width="240" height="126" rx="12" fill="#ffffff" stroke="#dbe5ed"/>
<rect x="285" y="88" width="300" height="126" rx="12" fill="#ffffff" stroke="#dbe5ed"/>
<rect x="610" y="88" width="290" height="126" rx="12" fill="#ffffff" stroke="#dbe5ed"/>
<text x="35" y="117" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" text-anchor="start" font-weight="700">① 测量给出模与相位</text>
<text x="35" y="146" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="start" font-weight="400">波腹间距 50 mm → λ = 100 mm</text>
<text x="35" y="171" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="start" font-weight="400">6 V / 1 V → ρ = 6，|ΓL| = 5/7</text>
<text x="35" y="196" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="start" font-weight="400">首波节 10 mm → φL = −108°</text>
<line x1="265.000" y1="151.000" x2="280.000" y2="151.000" stroke="#587080" stroke-width="2" marker-end="url(#arrow-587080)"/>
<text x="300" y="117" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" text-anchor="start" font-weight="700">② 恢复负载，分离行波功率</text>
<text x="300" y="146" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="start" font-weight="400">ΓL ≈ −0.220726 − j0.679326</text>
<text x="300" y="171" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="start" font-weight="400">ZL ≈ 12.548 − j34.808 Ω</text>
<text x="300" y="196" fill="#14796f" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" text-anchor="start" font-weight="400">122.5 − 62.5 = 60 mW</text>
<line x1="590.000" y1="151.000" x2="605.000" y2="151.000" stroke="#587080" stroke-width="2" marker-end="url(#arrow-587080)"/>
<text x="625" y="117" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" text-anchor="start" font-weight="700">③ 同一负载，两组短路支节</text>
<text x="625" y="148" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="start" font-weight="400">A：d=3.831，l_s=7.250 mm</text>
<text x="625" y="175" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="start" font-weight="400">B：d=16.169，l_s=42.750 mm</text>
<text x="625" y="199" fill="#587080" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="start" font-weight="400">两种长度必须成对，不能交叉取值</text>
<rect x="20" y="234" width="420" height="244" rx="12" fill="#ffffff" stroke="#dbe5ed"/>
<rect x="460" y="234" width="440" height="244" rx="12" fill="#ffffff" stroke="#dbe5ed"/>
<text x="38" y="262" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" text-anchor="start" font-weight="700">实际电压 Γ 平面：两种动作不能混用</text>
<text x="478" y="262" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" text-anchor="start" font-weight="700">④ 回代到结点，再说明功率条件</text>
