<text x="237" y="346" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" text-anchor="middle" font-weight="700">Γ₁ Γ₂ e⁻ʲ²ᵝᴸ = 1</text>
<text x="38" y="378" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" text-anchor="start" font-weight="400">无耗全反射：模长 1，相位为 2πn</text>
<text x="38" y="405" fill="#587080" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="start" font-weight="400">有损实频：仅相位闭合，幅度仍可衰减</text>
<text x="38" y="431" fill="#587080" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="start" font-weight="400">自由衰减模用复频率；不是无损自振</text>
<text x="38" y="460" fill="#2563eb" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="start" font-weight="400">TE₁₀₁ 示例：Sa = −0.64，SL = −0.36</text>
