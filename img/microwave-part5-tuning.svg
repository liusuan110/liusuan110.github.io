<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
<title id="title">谐振调谐：往返相位、电纳零点与参数灵敏度</title>
<desc id="desc">左图为单模式波在两个反射端之间往返，闭环因子为Gamma1乘Gamma2乘exp(-j2betaL)。实频相位闭合并不能抵消实际损耗。右图为长20毫米、阻抗50欧姆、波速2e8米每秒的短路线与端部电容的总电纳；电容取0.9、1、1.1皮法，基模零点随电容增大向低频移动。曲线由无耗解析模型计算，不是全场仿真。</desc>
<rect x="0" y="0" width="920" height="520" rx="16" fill="#f5f8fb" stroke="none"/>
<defs>
<marker id="arrow-2563eb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker>
<marker id="arrow-14796f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#14796f"/></marker>
<clipPath id="plot"><rect x="524" y="180" width="350" height="170"/></clipPath></defs>
<text x="25" y="36" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" text-anchor="start" font-weight="700">谐振调谐：先闭合往返相位，再看参数灵敏度</text>
<text x="26" y="66" fill="#587080" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" text-anchor="start" font-weight="400">理想无耗模型 · eʲωᵗ · 基模 0 &lt; θ ≤ π/2 · 实际损耗会引入自由衰减</text>
<rect x="20" y="90" width="420" height="388" rx="13" fill="#ffffff" stroke="#dbe5ed"/>
<rect x="460" y="90" width="440" height="388" rx="13" fill="#ffffff" stroke="#dbe5ed"/>
<text x="38" y="121" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" text-anchor="start" font-weight="700">① 往返后，幅度与相位都要复原</text>
<text x="480" y="121" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" text-anchor="start" font-weight="700">② 固定线长，寻找总电纳零点</text>
<text x="480" y="149" fill="#183344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" text-anchor="start" font-weight="400">B = ωC − cot(ωL/u) / Zc</text>
