<title id="title">端口匹配，不等于全部功率都在腔内耗散</title><desc id="desc">单模无直通传输背景的双端口谐振器，端口2接匹配负载。单位入射功率分成反射R、透射T和内部耗散A，三者之和为1。输入匹配条件为kappa1=1+kappa2。例中kappa1=1.5、kappa2=0.5，反射为0，透射为三分之一，耗散为三分之二。单端口欠耦合kappa=1/3与过耦合kappa=3的反射功率曲线完全重合，但在校准参考面上的共振反射振幅为正负0.5。</desc>
