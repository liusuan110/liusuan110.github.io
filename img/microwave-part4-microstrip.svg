<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
<title id="title">微带设计：线宽同时改变阻抗与波长</title><desc id="desc">空气与基片中的场线只作定性示意，非场求解结果。有效介电常数由同一几何结构下实际基片和全部空气两种静态单位长度电容之比定义，不是截面面积占比。下半图使用第四部分4.7相同薄导体准静态公式，先求宽度，再更新有效介电常数与90度长度。</desc>
<rect width="920" height="520" rx="16" fill="#f5f8fb"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker></defs>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#183344">
<text x="27" y="37" font-size="28" fill="#183344" text-anchor="start" font-weight="700">微带设计：线宽同时改变阻抗与波长</text>
<text x="28" y="69" font-size="20" fill="#587080" text-anchor="start" font-weight="400">低频准静态 · 薄导体 · εr=4.4，h=0.8 mm，f=2 GHz</text>
<rect x="25" y="92" width="420" height="201" rx="12" fill="#ffffff" stroke="#dbe5ed"/>
<rect x="465" y="92" width="430" height="201" rx="12" fill="#ffffff" stroke="#dbe5ed"/>
<text x="43" y="122" font-size="21" fill="#183344" text-anchor="start" font-weight="700">空气—基片中的电场（仅示意）</text>
<rect x="44" y="171" width="350" height="78" fill="#e2f0eb"/>
<line x1="44" y1="249" x2="394" y2="249" stroke="#183344" stroke-width="6" />
<line x1="153" y1="169" x2="285" y2="169" stroke="#183344" stroke-width="9" />
<text x="57" y="154" font-size="18" fill="#2563eb" text-anchor="start" font-weight="400">空气</text>
<text x="57" y="205" font-size="18" fill="#14796f" text-anchor="start" font-weight="400">基片 εr</text>
<text x="343" y="277" font-size="18" fill="#587080" text-anchor="middle" font-weight="400">接地平面</text>
<line x1="153" y1="147" x2="285" y2="147" stroke="#2563eb" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="219" y="142" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="400">W</text>
<line x1="405" y1="173" x2="405" y2="247" stroke="#2563eb" stroke-width="1.4" />
<line x1="400" y1="173" x2="410" y2="173" stroke="#2563eb" stroke-width="1.4" />
<line x1="400" y1="247" x2="410" y2="247" stroke="#2563eb" stroke-width="1.4" />
<text x="414" y="215" font-size="20" fill="#2563eb" text-anchor="start" font-weight="400">h</text>
<path d="M169 175 Q158 210 147 244" fill="none" stroke="#14796f" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M194 175 Q190 210 186 244" fill="none" stroke="#14796f" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M219 175 Q219 210 219 244" fill="none" stroke="#14796f" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M244 175 Q248 210 252 244" fill="none" stroke="#14796f" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M269 175 Q280 210 291 244" fill="none" stroke="#14796f" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M153 164 C121 128 99 164 123 244" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M285 164 C317 128 339 164 315 244" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="484" y="122" font-size="21" fill="#183344" text-anchor="start" font-weight="700">有效介电常数：比较静态电容</text>
<text x="680" y="150" font-size="19" fill="#587080" text-anchor="middle" font-weight="400">同一几何、同一静态电压 V</text>
<line x1="520" y1="183" x2="557" y2="183" stroke="#14796f" stroke-width="2" />
<line x1="573" y1="183" x2="610" y2="183" stroke="#14796f" stroke-width="2" />
<line x1="557" y1="164" x2="557" y2="202" stroke="#14796f" stroke-width="3" />
<line x1="573" y1="164" x2="573" y2="202" stroke="#14796f" stroke-width="3" />
<text x="565" y="228" font-size="20" fill="#14796f" text-anchor="middle" font-weight="400">实际基片 C′</text>
<line x1="745" y1="183" x2="782" y2="183" stroke="#2563eb" stroke-width="2" />
<line x1="798" y1="183" x2="835" y2="183" stroke="#2563eb" stroke-width="2" />
<line x1="782" y1="164" x2="782" y2="202" stroke="#2563eb" stroke-width="3" />
<line x1="798" y1="164" x2="798" y2="202" stroke="#2563eb" stroke-width="3" />
<text x="790" y="228" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="400">全部空气 C′air</text>
<text x="680" y="266" font-size="23" fill="#183344" text-anchor="middle" font-weight="400">εeff = C′ / C′air ≠ 截面面积占比</text>
<text x="28" y="322" font-size="22" fill="#183344" text-anchor="start" font-weight="700">先设计阻抗，再用该线宽的 εeff 求 90° 长度</text>
<rect x="25" y="337" width="198" height="148" rx="12" fill="#ffffff" stroke="#dbe5ed"/>
<text x="124" y="367" font-size="20" fill="#183344" text-anchor="middle" font-weight="700">① 目标阻抗</text>
<line x1="38" y1="381" x2="210" y2="381" stroke="#dbe5ed" stroke-width="1" />
<rect x="249" y="337" width="198" height="148" rx="12" fill="#ffffff" stroke="#dbe5ed"/>
<text x="348" y="367" font-size="20" fill="#183344" text-anchor="middle" font-weight="700">② 反求宽度 W</text>
<line x1="262" y1="381" x2="434" y2="381" stroke="#dbe5ed" stroke-width="1" />
<rect x="473" y="337" width="198" height="148" rx="12" fill="#ffffff" stroke="#dbe5ed"/>
<text x="572" y="367" font-size="20" fill="#183344" text-anchor="middle" font-weight="700">③ 更新 εeff</text>
<line x1="486" y1="381" x2="658" y2="381" stroke="#dbe5ed" stroke-width="1" />
<rect x="697" y="337" width="198" height="148" rx="12" fill="#ffffff" stroke="#dbe5ed"/>
<text x="796" y="367" font-size="20" fill="#183344" text-anchor="middle" font-weight="700">④ 求 90° 长度</text>
<line x1="710" y1="381" x2="882" y2="381" stroke="#dbe5ed" stroke-width="1" />
<line x1="226" y1="414" x2="246" y2="414" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="450" y1="414" x2="470" y2="414" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="674" y1="414" x2="694" y2="414" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="124" y="412" font-size="26" fill="#14796f" text-anchor="middle" font-weight="700">50 Ω</text>
<text x="348" y="407" font-size="22" fill="#14796f" text-anchor="middle" font-weight="700">1.5415 mm</text>
<text x="348" y="427" font-size="16" fill="#587080" text-anchor="middle" font-weight="400">p=1.9268</text>
<text x="572" y="412" font-size="25" fill="#14796f" text-anchor="middle" font-weight="700">3.3323</text>
<text x="796" y="412" font-size="23" fill="#14796f" text-anchor="middle" font-weight="700">20.5427 mm</text>
<text x="124" y="460" font-size="26" fill="#c66a22" text-anchor="middle" font-weight="700">100 Ω</text>
<text x="348" y="455" font-size="22" fill="#c66a22" text-anchor="middle" font-weight="700">0.3520 mm</text>
<text x="348" y="475" font-size="16" fill="#587080" text-anchor="middle" font-weight="400">p=0.4400</text>
<text x="572" y="460" font-size="25" fill="#c66a22" text-anchor="middle" font-weight="700">3.0410</text>
<text x="796" y="460" font-size="23" fill="#c66a22" text-anchor="middle" font-weight="700">21.5040 mm</text>
<text x="460" y="512" font-size="20" fill="#587080" text-anchor="middle" font-weight="400">同一块板，线宽不同 → εeff 不同 → 90° 的物理长度也不同。</text>
</g></svg>
