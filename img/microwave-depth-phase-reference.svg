<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
<title id="title">负载相位决定波节起点，向源距离决定相位转角</title>
<desc id="desc">无耗线采用时间因子exp(jωt)。负载在左，信号源在右，d向源增加。反射系数相位为φL−2βd；例示|ΓL|=0.5、φL=120度，电压极小点位于d/λ=5/12和11/12，相邻极小点间隔半波长。</desc>
