<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-labelledby="title desc">
<title id="title">期中多段线：先换各段波长，再在共同结点相加导纳</title>
<desc id="desc">6GHz下，50欧姆介质线长15毫米，经过100西门子电导与50皮法电容的并联结点，再接100欧姆空气线50毫米及复负载；分别求各参考面阻抗和两段驻波比。</desc>
<rect width="920" height="540" rx="18" fill="#f4f8fa"/>
<text x="25" y="38" fill="#193a4c" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="26" font-weight="700" text-anchor="start">先换各段波长，再在同一结点相加导纳</text>
<text x="25" y="67" fill="#587587" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400" text-anchor="start">2022—2023 期中第七题 · 按原图 G=100 S、C=50 pF 计算</text>
<rect x="20" y="87" width="880" height="230" rx="10" fill="#fff" stroke="#d7e2e7"/>
<line x1="50" y1="170" x2="160" y2="170" stroke="#193a4c" stroke-width="2"/>
<line x1="50" y1="266" x2="160" y2="266" stroke="#193a4c" stroke-width="2"/>
<rect x="160" y="163" width="160" height="14" fill="#e3efef" stroke="#137e73"/>
<line x1="320" y1="170" x2="655" y2="170" stroke="#193a4c" stroke-width="2"/>
<rect x="655" y="163" width="135" height="14" fill="#e6eef7" stroke="#326fa6"/>
<line x1="790" y1="170" x2="836" y2="170" stroke="#193a4c" stroke-width="2"/>
<rect x="160" y="259" width="160" height="14" fill="#e3efef" stroke="#137e73"/>
<line x1="320" y1="266" x2="655" y2="266" stroke="#193a4c" stroke-width="2"/>
<rect x="655" y="259" width="135" height="14" fill="#e6eef7" stroke="#326fa6"/>
<line x1="790" y1="266" x2="836" y2="266" stroke="#193a4c" stroke-width="2"/>
<line x1="836" y1="170" x2="836" y2="199" stroke="#193a4c" stroke-width="2"/>
<line x1="836" y1="237" x2="836" y2="266" stroke="#193a4c" stroke-width="2"/>
<rect x="826" y="199" width="20" height="38" fill="#e3e8ee" stroke="#193a4c"/>
<line x1="420" y1="170" x2="420" y2="197" stroke="#193a4c" stroke-width="2"/>
<line x1="420" y1="237" x2="420" y2="266" stroke="#193a4c" stroke-width="2"/>
<rect x="411" y="197" width="18" height="40" fill="#f6eadf" stroke="#b75f20"/>
<line x1="540" y1="170" x2="540" y2="208" stroke="#193a4c" stroke-width="2"/>
<line x1="525" y1="208" x2="555" y2="208" stroke="#b75f20" stroke-width="3"/>
<line x1="525" y1="221" x2="555" y2="221" stroke="#b75f20" stroke-width="3"/>
<line x1="540" y1="221" x2="540" y2="266" stroke="#193a4c" stroke-width="2"/>
<line x1="95" y1="129" x2="95" y2="285" stroke="#587587" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="620" y1="129" x2="620" y2="285" stroke="#587587" stroke-width="1" stroke-dasharray="4 4"/>
<text x="95" y="119" fill="#137e73" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="600" text-anchor="middle">BB′</text>
<text x="620" y="119" fill="#326fa6" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="600" text-anchor="middle">AA′</text>
<text x="240" y="135" fill="#137e73" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="18" font-weight="600" text-anchor="middle">线②：50 Ω</text>
<text x="240" y="300" fill="#137e73" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400" text-anchor="middle">εr=4；15 mm</text>
<text x="725" y="135" fill="#326fa6" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="18" font-weight="600" text-anchor="middle">线①：100 Ω</text>
<text x="725" y="300" fill="#326fa6" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400" text-anchor="middle">空气；50 mm</text>
<text x="420" y="190" fill="#b75f20" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="16" font-weight="400" text-anchor="end">G</text>
<text x="540" y="190" fill="#b75f20" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="16" font-weight="400" text-anchor="end">C</text>
<text x="870" y="217" fill="#193a4c" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="16" font-weight="400" text-anchor="middle">ZL</text>
<text x="470" y="300" fill="#b75f20" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400" text-anchor="middle">J：合并后的终端</text>
<rect x="20" y="334" width="280" height="131" rx="10" fill="#fff" stroke="#d7e2e7"/>
<text x="35" y="364" fill="#193a4c" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="18" font-weight="650" text-anchor="start">① 先由右向左算阻抗</text>
<text x="35" y="403" fill="#137e73" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400" text-anchor="start">ZA = 100 + j60 Ω</text>
<text x="35" y="438" fill="#587587" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400" text-anchor="start">YJ = 1/ZA + G + jωC</text>
<rect x="320" y="334" width="280" height="131" rx="10" fill="#fff" stroke="#d7e2e7"/>
<text x="335" y="364" fill="#193a4c" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="18" font-weight="650" text-anchor="start">② 再经介质线变换</text>
<text x="335" y="403" fill="#137e73" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400" text-anchor="start">λ1=50 mm；λ2=25 mm</text>
<text x="335" y="438" fill="#587587" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400" text-anchor="start">θ1=360°；θ2=216°</text>
<rect x="620" y="334" width="280" height="131" rx="10" fill="#fff" stroke="#d7e2e7"/>
<text x="635" y="364" fill="#193a4c" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="18" font-weight="650" text-anchor="start">③ 两段分别求驻波比</text>
<text x="635" y="403" fill="#137e73" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400" text-anchor="start">ρ1 ≈ 1.8064</text>
<text x="635" y="438" fill="#587587" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400" text-anchor="start">ρ2 ≈ 5002.136</text>
<text x="30" y="498" fill="#193a4c" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="18" font-weight="600" text-anchor="start">同一段无耗线保持 |Γ|；跨过并联元件和阻抗突变后，须重新归一化。</text>
<text x="30" y="526" fill="#587587" font-family="system-ui,-apple-system,PingFang SC,sans-serif" font-size="17" font-weight="400" text-anchor="start">线段无耗 ≠ 网络无耗：电导耗散平均功率，理想电容不耗散平均功率。</text>
</svg>
