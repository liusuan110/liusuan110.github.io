<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
<title id="title">期中两种匹配路线：波腹加变换段、主线加并联短路支节</title>
<desc id="desc">上图负载二十五加j五十欧，先保留原五十欧主线到最近波腹，长度为空气波长的0.115104倍，再插入一百零三点二六六欧的四分之一波长变换段。该题没有给频率。下图为五GHz空气线，负载二百减j五十欧，短路并联支节有两组成对解：主线十点一毫米和支节五点三八五毫米，或主线十八点七一二毫米和支节二十四点六一五毫米。</desc>
<rect width="920" height="520" rx="16" fill="#f5f8fb"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#14796f"/></marker></defs>
<text x="24" y="31" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" fill="#183344" text-anchor="start" font-weight="700">期中匹配综合：先找参考面，再决定加哪一段线</text>
<text x="24" y="55" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#587080" text-anchor="start" font-weight="400">2022—2023 期中四、五 · 原卷 PDF 第 5、6 页 · 距离 d 从负载向源量 · 图示不按长度比例</text>
<rect x="18" y="76" width="884" height="181" rx="12" fill="white" stroke="#dbe5ed"/>
<text x="34" y="102" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#183344" text-anchor="start" font-weight="700">M-2 先到波腹 P，再串入四分之一波长变换段</text>
<line x1="780.000" y1="125.000" x2="430.000" y2="125.000" stroke="#14796f" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="606" y="118" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#14796f" text-anchor="middle" font-weight="400">从负载向源量 d</text>
<line x1="64.000" y1="173.000" x2="190.000" y2="173.000" stroke="#2563eb" stroke-width="3"/>
<rect x="190" y="155" width="215" height="36" rx="4" fill="#f5f8fb" stroke="#c66a22" stroke-width="2"/><text x="297.5" y="178" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#c66a22" text-anchor="middle" font-weight="400">新增 Zt = 103.266 Ω</text>
<line x1="405.000" y1="173.000" x2="480.000" y2="173.000" stroke="#2563eb" stroke-width="3"/>
<rect x="480" y="160" width="205" height="26" rx="4" fill="#f5f8fb" stroke="#2563eb" stroke-width="2"/><text x="582.5" y="178" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="400">保留的原 50 Ω 主线</text>
<line x1="685.000" y1="173.000" x2="788.000" y2="173.000" stroke="#2563eb" stroke-width="3"/>
<rect x="788" y="155" width="66" height="36" rx="4" fill="#f5f8fb" stroke="#183344" stroke-width="2"/><text x="821" y="178" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#183344" text-anchor="middle" font-weight="400">ZL</text>
<text x="126" y="150" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="400">源侧 50 Ω</text>
<text x="405" y="148" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#c66a22" text-anchor="middle" font-weight="400">P：213.278 Ω</text>
<text x="854" y="147" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#183344" text-anchor="end" font-weight="400">25+j50 Ω</text>
<line x1="190.000" y1="152.000" x2="190.000" y2="203.000" stroke="#587080" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="405.000" y1="152.000" x2="405.000" y2="203.000" stroke="#587080" stroke-width="1" stroke-dasharray="4 4"/>
<circle cx="405" cy="173" r="4" fill="#c66a22" stroke="white" stroke-width="1"/>
<line x1="190.000" y1="206.000" x2="405.000" y2="206.000" stroke="#c66a22" stroke-width="1.2"/><line x1="190.000" y1="201.000" x2="190.000" y2="211.000" stroke="#c66a22" stroke-width="1.2"/><line x1="405.000" y1="201.000" x2="405.000" y2="211.000" stroke="#c66a22" stroke-width="1.2"/><text x="297.5" y="226" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#c66a22" text-anchor="middle" font-weight="400">lt = λt/4</text>
<line x1="405.000" y1="206.000" x2="821.000" y2="206.000" stroke="#14796f" stroke-width="1.2"/><line x1="405.000" y1="201.000" x2="405.000" y2="211.000" stroke="#14796f" stroke-width="1.2"/><line x1="821.000" y1="201.000" x2="821.000" y2="211.000" stroke="#14796f" stroke-width="1.2"/><text x="613" y="226" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#14796f" text-anchor="middle" font-weight="400">dmax = 0.115104 λ₀</text>
<text x="34" y="247" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#587080" text-anchor="start" font-weight="400">源侧 Γ=0；P 至负载 ρ=4.26556，变换段 ρ=2.06532。本题无频率，不能换成 mm。</text>
<rect x="18" y="270" width="884" height="222" rx="12" fill="white" stroke="#dbe5ed"/>
<text x="34" y="297" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#183344" text-anchor="start" font-weight="700">M-3 先令 g(d)=1，再并联短路支节补偿电纳</text>
<line x1="780.000" y1="322.000" x2="370.000" y2="322.000" stroke="#14796f" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="580" y="315" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#14796f" text-anchor="middle" font-weight="400">主线位置 d（5 GHz：λ = 60 mm）</text>
<line x1="64.000" y1="360.000" x2="480.000" y2="360.000" stroke="#2563eb" stroke-width="3"/>
<rect x="480" y="347" width="205" height="26" rx="4" fill="#f5f8fb" stroke="#2563eb" stroke-width="2"/><text x="582.5" y="365" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="400">主线 50 Ω</text>
<line x1="685.000" y1="360.000" x2="788.000" y2="360.000" stroke="#2563eb" stroke-width="3"/>
<rect x="788" y="342" width="66" height="36" rx="4" fill="#f5f8fb" stroke="#183344" stroke-width="2"/><text x="821" y="365" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#183344" text-anchor="middle" font-weight="400">ZL</text>
<text x="126" y="344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="400">源侧匹配</text>
<text x="350" y="344" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#c66a22" text-anchor="middle" font-weight="400">J：1±j1.58114</text>
<text x="854" y="334" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#183344" text-anchor="end" font-weight="400">200−j50 Ω</text>
<line x1="350.000" y1="360.000" x2="350.000" y2="424.000" stroke="#c66a22" stroke-width="3"/>
<circle cx="350" cy="360" r="4" fill="#c66a22" stroke="white" stroke-width="1"/>
<line x1="330.000" y1="424.000" x2="370.000" y2="424.000" stroke="#c66a22" stroke-width="4"/>
<text x="325" y="399" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#c66a22" text-anchor="end" font-weight="400">ls</text>
<text x="350" y="445" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#c66a22" text-anchor="middle" font-weight="400">短路</text>
<text x="386" y="405" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#c66a22" text-anchor="start" font-weight="400">支节 50 Ω</text>
<text x="510" y="407" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#2563eb" text-anchor="start" font-weight="700">A：d=10.1003 mm，ls=5.3853 mm</text>
<text x="510" y="435" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#587080" text-anchor="start" font-weight="400">B：d=18.7122 mm，ls=24.6147 mm</text>
<text x="34" y="478" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#587080" text-anchor="start" font-weight="400">本题 A 同时给出短主线和最短支节；两组长度必须成对使用，不能交叉拼接。</text>
<text x="24" y="513" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#587080" text-anchor="start" font-weight="400">主线、变换段、支节分别使用自己的波长；源侧匹配，不意味着匹配网络内部处处没有驻波。</text>
</svg>
