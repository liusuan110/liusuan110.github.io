<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="615" viewBox="0 0 1000 615" role="img" aria-labelledby="title desc">
<title id="title">翻转与平移：先找旧编号，再确定新编号</title><desc id="desc">例 2-1：原序列在编号负一、零、一、二处分别为一、三、负一、二。经过 y[n]=x[2-n]，新序列在零、一、二、三处分别为二、负一、三、一。其余样本为零。</desc>
<rect width="1000" height="615" rx="18" fill="#fffdf9"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#2c2825">
<text x="40" y="45" font-size="27" fill="#2c2825" text-anchor="start" font-weight="bold">翻转与平移：先找旧编号，再确定新编号</text>
<text x="40" y="80" font-size="21" fill="#72695e" text-anchor="start" font-weight="normal">y[n] = x[2 − n]：令 m = 2 − n，解得新编号 n = 2 − m</text>
<text x="40" y="116" font-size="21" fill="#14796f" text-anchor="start" font-weight="bold">原序列 x[n]</text>
<line x1="100.00" y1="273.00" x2="935.00" y2="273.00" stroke="#e5ded2" stroke-width="1" />
<text x="80" y="278" font-size="16" fill="#72695e" text-anchor="end" font-weight="normal">-1</text>
<line x1="100.00" y1="205.00" x2="935.00" y2="205.00" stroke="#e5ded2" stroke-width="1" />
<text x="80" y="210" font-size="16" fill="#72695e" text-anchor="end" font-weight="normal">1</text>
<line x1="100.00" y1="171.00" x2="935.00" y2="171.00" stroke="#e5ded2" stroke-width="1" />
<text x="80" y="176" font-size="16" fill="#72695e" text-anchor="end" font-weight="normal">2</text>
<line x1="100.00" y1="137.00" x2="935.00" y2="137.00" stroke="#e5ded2" stroke-width="1" />
<text x="80" y="142" font-size="16" fill="#72695e" text-anchor="end" font-weight="normal">3</text>
<line x1="100.00" y1="239.00" x2="935.00" y2="239.00" stroke="#a89f91" stroke-width="1.4" />
<text x="80" y="244" font-size="16" fill="#72695e" text-anchor="end" font-weight="normal">0</text>
<circle cx="100.00" cy="239.00" r="3" fill="#b9b2a7"/>
<line x1="100.00" y1="235.00" x2="100.00" y2="243.00" stroke="#a89f91" stroke-width="1" />
<text x="100.0" y="311" font-size="17" fill="#72695e" text-anchor="middle" font-weight="normal">-2</text>
<line x1="239.17" y1="239.00" x2="239.17" y2="205.00" stroke="#14796f" stroke-width="3" />
<circle cx="239.17" cy="205.00" r="5.5" fill="#14796f"/>
<text x="239.16666666666666" y="193" font-size="19" fill="#14796f" text-anchor="middle" font-weight="bold">1</text>
<line x1="239.17" y1="235.00" x2="239.17" y2="243.00" stroke="#a89f91" stroke-width="1" />
<text x="239.16666666666666" y="311" font-size="17" fill="#72695e" text-anchor="middle" font-weight="normal">-1</text>
<line x1="378.33" y1="239.00" x2="378.33" y2="137.00" stroke="#14796f" stroke-width="3" />
<circle cx="378.33" cy="137.00" r="5.5" fill="#14796f"/>
<text x="378.3333333333333" y="125" font-size="19" fill="#14796f" text-anchor="middle" font-weight="bold">3</text>
<line x1="378.33" y1="235.00" x2="378.33" y2="243.00" stroke="#a89f91" stroke-width="1" />
<text x="378.3333333333333" y="311" font-size="17" fill="#72695e" text-anchor="middle" font-weight="normal">0</text>
<line x1="517.50" y1="239.00" x2="517.50" y2="273.00" stroke="#14796f" stroke-width="3" />
<circle cx="517.50" cy="273.00" r="5.5" fill="#14796f"/>
<text x="517.5" y="295" font-size="19" fill="#14796f" text-anchor="middle" font-weight="bold">-1</text>
<line x1="517.50" y1="235.00" x2="517.50" y2="243.00" stroke="#a89f91" stroke-width="1" />
<text x="517.5" y="311" font-size="17" fill="#72695e" text-anchor="middle" font-weight="normal">1</text>
<line x1="656.67" y1="239.00" x2="656.67" y2="171.00" stroke="#14796f" stroke-width="3" />
<circle cx="656.67" cy="171.00" r="5.5" fill="#14796f"/>
<text x="656.6666666666666" y="159" font-size="19" fill="#14796f" text-anchor="middle" font-weight="bold">2</text>
<line x1="656.67" y1="235.00" x2="656.67" y2="243.00" stroke="#a89f91" stroke-width="1" />
<text x="656.6666666666666" y="311" font-size="17" fill="#72695e" text-anchor="middle" font-weight="normal">2</text>
<circle cx="795.83" cy="239.00" r="3" fill="#b9b2a7"/>
<line x1="795.83" y1="235.00" x2="795.83" y2="243.00" stroke="#a89f91" stroke-width="1" />
<text x="795.8333333333334" y="311" font-size="17" fill="#72695e" text-anchor="middle" font-weight="normal">3</text>
<circle cx="935.00" cy="239.00" r="3" fill="#b9b2a7"/>
<line x1="935.00" y1="235.00" x2="935.00" y2="243.00" stroke="#a89f91" stroke-width="1" />
<text x="935.0" y="311" font-size="17" fill="#72695e" text-anchor="middle" font-weight="normal">4</text>
<text x="960" y="311" font-size="18" fill="#72695e" text-anchor="start" font-weight="normal">n</text>
<text x="40" y="354" font-size="21" fill="#526b86" text-anchor="start" font-weight="bold">变换后的序列 y[n] = x[2 − n]</text>
<line x1="100.00" y1="511.00" x2="935.00" y2="511.00" stroke="#e5ded2" stroke-width="1" />
<text x="80" y="516" font-size="16" fill="#72695e" text-anchor="end" font-weight="normal">-1</text>
<line x1="100.00" y1="443.00" x2="935.00" y2="443.00" stroke="#e5ded2" stroke-width="1" />
<text x="80" y="448" font-size="16" fill="#72695e" text-anchor="end" font-weight="normal">1</text>
<line x1="100.00" y1="409.00" x2="935.00" y2="409.00" stroke="#e5ded2" stroke-width="1" />
<text x="80" y="414" font-size="16" fill="#72695e" text-anchor="end" font-weight="normal">2</text>
<line x1="100.00" y1="375.00" x2="935.00" y2="375.00" stroke="#e5ded2" stroke-width="1" />
<text x="80" y="380" font-size="16" fill="#72695e" text-anchor="end" font-weight="normal">3</text>
<line x1="100.00" y1="477.00" x2="935.00" y2="477.00" stroke="#a89f91" stroke-width="1.4" />
