<line x1="100.00" y1="473.00" x2="100.00" y2="481.00" stroke="#a89f91" stroke-width="1" />
<text x="100.0" y="549" font-size="17" fill="#72695e" text-anchor="middle" font-weight="normal">-2</text>
<circle cx="239.17" cy="477.00" r="3" fill="#b9b2a7"/>
<line x1="239.17" y1="473.00" x2="239.17" y2="481.00" stroke="#a89f91" stroke-width="1" />
<text x="239.16666666666666" y="549" font-size="17" fill="#72695e" text-anchor="middle" font-weight="normal">-1</text>
<line x1="378.33" y1="477.00" x2="378.33" y2="409.00" stroke="#526b86" stroke-width="3" />
<circle cx="378.33" cy="409.00" r="5.5" fill="#526b86"/>
<text x="378.3333333333333" y="397" font-size="19" fill="#526b86" text-anchor="middle" font-weight="bold">2</text>
<line x1="378.33" y1="473.00" x2="378.33" y2="481.00" stroke="#a89f91" stroke-width="1" />
<text x="378.3333333333333" y="549" font-size="17" fill="#72695e" text-anchor="middle" font-weight="normal">0</text>
<line x1="517.50" y1="477.00" x2="517.50" y2="511.00" stroke="#526b86" stroke-width="3" />
<circle cx="517.50" cy="511.00" r="5.5" fill="#526b86"/>
<text x="517.5" y="533" font-size="19" fill="#526b86" text-anchor="middle" font-weight="bold">-1</text>
<line x1="517.50" y1="473.00" x2="517.50" y2="481.00" stroke="#a89f91" stroke-width="1" />
<text x="517.5" y="549" font-size="17" fill="#72695e" text-anchor="middle" font-weight="normal">1</text>
<line x1="656.67" y1="477.00" x2="656.67" y2="375.00" stroke="#526b86" stroke-width="3" />
<circle cx="656.67" cy="375.00" r="5.5" fill="#526b86"/>
<text x="656.6666666666666" y="363" font-size="19" fill="#526b86" text-anchor="middle" font-weight="bold">3</text>
<line x1="656.67" y1="473.00" x2="656.67" y2="481.00" stroke="#a89f91" stroke-width="1" />
<text x="656.6666666666666" y="549" font-size="17" fill="#72695e" text-anchor="middle" font-weight="normal">2</text>
<line x1="795.83" y1="477.00" x2="795.83" y2="443.00" stroke="#526b86" stroke-width="3" />
<circle cx="795.83" cy="443.00" r="5.5" fill="#526b86"/>
<text x="795.8333333333334" y="431" font-size="19" fill="#526b86" text-anchor="middle" font-weight="bold">1</text>
<line x1="795.83" y1="473.00" x2="795.83" y2="481.00" stroke="#a89f91" stroke-width="1" />
<text x="795.8333333333334" y="549" font-size="17" fill="#72695e" text-anchor="middle" font-weight="normal">3</text>
<circle cx="935.00" cy="477.00" r="3" fill="#b9b2a7"/>
<line x1="935.00" y1="473.00" x2="935.00" y2="481.00" stroke="#a89f91" stroke-width="1" />
<text x="935.0" y="549" font-size="17" fill="#72695e" text-anchor="middle" font-weight="normal">4</text>
<text x="960" y="549" font-size="18" fill="#72695e" text-anchor="start" font-weight="normal">n</text>
<text x="500" y="596" font-size="21" fill="#2c2825" text-anchor="middle" font-weight="normal">旧编号 → 新编号：−1 → 3，0 → 2，1 → 1，2 → 0；幅值保持不变。</text>
</g></svg>