<title id="title">有限序列DTFT与周期延拓DFS</title><desc id="desc">上图为有限矩形R4的DTFT模连续曲线，下图为其8周期延拓的8个DFS系数的模。系数无分析归一化，直流为4。无限周期序列的DTFT是冲激线谱，不是上方连续曲线。</desc>
