<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
<title id="title">沿线移动与添加支节，是两种不同的动作</title>
<desc id="desc">左面板采用实际电压反射系数Γ，右面板采用仅供阻抗网格代读导纳的Γy=-Γ。示例中ΓL=-1/√2，向源移动λ/16后y=1-j2，再并联归一化电纳+j2达到匹配。两面板用同一状态的相反坐标表示；坐标取反不会增加任何传输线长度。</desc>
<rect width="920" height="500" rx="16" fill="#f5f8fb"/>
<defs>
<marker id="arrow-183344" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#183344"/></marker>
<marker id="arrow-587080" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#587080"/></marker>
<marker id="arrow-14796f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#14796f"/></marker>
<marker id="arrow-2563eb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker>
<marker id="arrow-c66a22" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#c66a22"/></marker>
</defs>
<text x="27" y="36" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" fill="#183344" text-anchor="start" font-weight="700">沿线移动与添加支节，是两种不同的动作</text>
<text x="28" y="67" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#587080" text-anchor="start" font-weight="400">左右是同一网络状态；右图仅把坐标取反，不能把换图当作移动 λ/4</text>
<rect x="25" y="89" width="422" height="325" rx="13" fill="#ffffff" stroke="#dbe5ed" stroke-width="1.2"/>
<rect x="473" y="89" width="422" height="325" rx="13" fill="#ffffff" stroke="#dbe5ed" stroke-width="1.2"/>
<text x="43" y="116" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" fill="#183344" text-anchor="start" font-weight="700">实际电压反射系数平面</text>
<text x="236" y="147" font-family="'STIX Two Math', 'Cambria Math', 'Times New Roman', serif" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="400">Γ = (z − 1)/(z + 1)</text>
<text x="491" y="116" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" fill="#183344" text-anchor="start" font-weight="700">阻抗网格代读导纳的辅助坐标</text>
<text x="684" y="147" font-family="'STIX Two Math', 'Cambria Math', 'Times New Roman', serif" font-size="22" fill="#2563eb" text-anchor="middle" font-weight="400">Γy = (y − 1)/(y + 1) = −Γ</text>
