<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
<title id="title">有限定向性：泄漏与真实反射相干相加</title><desc id="desc">端口编号固定为1输入、2直通接待测负载、3前向耦合参考、4反向测量。前向归一化和耦合跟踪视为理想，只保留有效定向性泄漏。真实反射系数旋转到正实轴作图，测量矢量端点位于以真实反射系数为圆心、泄漏幅度为半径的圆上。真实回波损耗30dB、定向性40dB时，测得回波损耗可能在27.61至33.30dB之间。</desc>
<rect width="920" height="520" rx="16" fill="#f5f8fb"/>
<defs>
<marker id="arrow-2563eb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker>
<marker id="arrow-14796f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#14796f"/></marker>
<marker id="arrow-c66a22" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c66a22"/></marker>
<marker id="arrow-587080" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#587080"/></marker>
</defs>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#183344">
<text x="27" y="36" font-size="27" fill="#183344" text-anchor="start" font-weight="700">有限定向性：泄漏与真实反射相干相加</text>
<text x="28" y="67" font-size="18" fill="#587080" text-anchor="start" font-weight="400">前向与耦合通道已归一化，仅保留泄漏项；不是完整 VNA 误差模型</text>
<rect x="25" y="89" width="870" height="113" rx="12" fill="#ffffff" stroke="#dbe5ed"/>
<rect x="245" y="108" width="300" height="62" rx="9" fill="#e2f0eb" stroke="#14796f"/>
<text x="395" y="145" font-size="23" fill="#14796f" text-anchor="middle" font-weight="700">定向耦合器</text>
<line x1="61.000" y1="131.000" x2="232.000" y2="131.000" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow-2563eb)"/>
<text x="137" y="120" font-size="19" fill="#2563eb" text-anchor="middle" font-weight="400">前向波</text>
<text x="233" y="125" font-size="21" fill="#2563eb" text-anchor="end" font-weight="400">1</text>
<line x1="553.000" y1="131.000" x2="748.000" y2="131.000" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow-2563eb)"/>
<text x="558" y="125" font-size="21" fill="#2563eb" text-anchor="start" font-weight="400">2</text>
<line x1="748.000" y1="161.000" x2="554.000" y2="161.000" stroke="#14796f" stroke-width="2.5"  marker-end="url(#arrow-14796f)"/>
<text x="666" y="187" font-size="18" fill="#14796f" text-anchor="middle" font-weight="400">负载反射</text>
<rect x="755" y="109" width="116" height="62" rx="8" fill="#f4f7fb" stroke="#587080"/>
<text x="813" y="146" font-size="20" fill="#587080" text-anchor="middle" font-weight="400">待测负载</text>
<line x1="330.000" y1="171.000" x2="330.000" y2="187.000" stroke="#2563eb" stroke-width="2.5"  marker-end="url(#arrow-2563eb)"/>
<line x1="465.000" y1="171.000" x2="465.000" y2="187.000" stroke="#c66a22" stroke-width="2.5"  marker-end="url(#arrow-c66a22)"/>
<text x="302" y="197" font-size="17" fill="#2563eb" text-anchor="end" font-weight="400">3 前向参考</text>
<text x="478" y="197" font-size="17" fill="#c66a22" text-anchor="start" font-weight="400">4 反向读数</text>
<rect x="25" y="215" width="500" height="281" rx="12" fill="#ffffff" stroke="#dbe5ed"/>
<rect x="545" y="215" width="350" height="281" rx="12" fill="#ffffff" stroke="#dbe5ed"/>
<text x="43" y="244" font-size="21" fill="#183344" text-anchor="start" font-weight="700">Γm 的端点落在泄漏误差圆上</text>
<line x1="75.000" y1="355.000" x2="492.000" y2="355.000" stroke="#587080" stroke-width="1.4"  marker-end="url(#arrow-587080)"/>
<line x1="90.000" y1="448.000" x2="90.000" y2="263.000" stroke="#587080" stroke-width="1.4"  marker-end="url(#arrow-587080)"/>
<text x="483" y="345" font-size="17" fill="#587080" text-anchor="end" font-weight="400">Re Γ</text>
<text x="101" y="267" font-size="17" fill="#587080" text-anchor="start" font-weight="400">Im Γ</text>
<circle cx="342.982" cy="355.0" r="80.0" fill="#fdf4e9" stroke="#c66a22" stroke-width="2"/>
<line x1="90.000" y1="355.000" x2="342.982" y2="355.000" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow-2563eb)"/>
<line x1="90.000" y1="355.000" x2="388.868" y2="289.468" stroke="#14796f" stroke-width="3"  marker-end="url(#arrow-14796f)"/>
<line x1="342.982" y1="355.000" x2="388.868" y2="289.468" stroke="#c66a22" stroke-width="3"  marker-end="url(#arrow-c66a22)"/>
<circle cx="342.982" cy="355.000" r="4.5" fill="#2563eb" stroke="white" stroke-width="1.5"/>
<circle cx="388.868" cy="289.468" r="4.5" fill="#14796f" stroke="white" stroke-width="1.5"/>
<circle cx="262.982" cy="355.000" r="4.5" fill="#c66a22" stroke="white" stroke-width="1.5"/>
<circle cx="422.982" cy="355.000" r="4.5" fill="#c66a22" stroke="white" stroke-width="1.5"/>
<text x="209" y="347" font-size="25" fill="#2563eb" text-anchor="start" font-weight="400">Γ</text>
<text x="205" y="302" font-size="23" fill="#14796f" text-anchor="start" font-weight="400">Γm</text>
<text x="365" y="268" font-size="18" fill="#c66a22" text-anchor="start" font-weight="400">ε exp(jφ)</text>
<text x="82" y="380" font-size="18" fill="#587080" text-anchor="end" font-weight="400">0</text>
<text x="259.982" y="385" font-size="18" fill="#c66a22" text-anchor="middle" font-weight="400">|Γ|−ε</text>
<text x="424.982" y="385" font-size="18" fill="#c66a22" text-anchor="middle" font-weight="400">|Γ|+ε</text>
<text x="275" y="473" font-size="18" fill="#587080" text-anchor="middle" font-weight="400">圆心：真实 Γ；半径：ε=0.01（D=40 dB）</text>
<text x="564" y="245" font-size="23" fill="#183344" text-anchor="start" font-weight="700">真实 RL = 30 dB</text>
<text x="720" y="282" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="400">|Γ| = 0.031623</text>
<text x="720" y="316" font-size="21" fill="#c66a22" text-anchor="middle" font-weight="400">ε = 10^(−40/20) = 0.01</text>
<text x="720" y="356" font-size="20" fill="#183344" text-anchor="middle" font-weight="400">0.021623 ≤ |Γm| ≤ 0.041623</text>
<text x="720" y="397" font-size="23" fill="#14796f" text-anchor="middle" font-weight="700">27.61 ≤ RLm ≤ 33.30 dB</text>
<text x="720" y="436" font-size="19" fill="#587080" text-anchor="middle" font-weight="400">若反射幅度相对误差 ≤10%：</text>
<text x="720" y="472" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="700">D ≥ RL + 20 = 50 dB</text>
<text x="460" y="517" font-size="19" fill="#587080" text-anchor="middle" font-weight="400">定向性底线描述测量泄漏，不是负载本身的反射。</text>
</g></svg>
