<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="595" viewBox="0 0 1000 595" role="img" aria-labelledby="title desc">
<title id="title">循环卷积把线性卷积按周期叠加</title><desc id="desc">线性卷积2、3、6、6、5、2按周期4折叠，5加到编号0，2加到编号1，结果7、5、6、6。编号2和3没有混入尾部。</desc>
<rect width="1000" height="595" rx="18" fill="#fffdf9"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#2c2825">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#72695e"/></marker></defs>
<text x="40" y="45" font-size="28" fill="#2c2825" text-anchor="start" font-weight="bold">循环卷积：按同余编号相加</text>
<text x="40" y="82" font-size="20" fill="#72695e" text-anchor="start" font-weight="normal">x = [1, 1, 1]，h = [2, 1, 3, 2]；循环长度 M = 4</text>
<text x="40" y="136" font-size="22" fill="#2c2825" text-anchor="start" font-weight="bold">线性输出 y_l</text>
<rect x="82" y="157" width="96" height="64" rx="9" fill="#526b86" fill-opacity=".1"/>
<text x="130" y="199" font-size="30" fill="#526b86" text-anchor="middle" font-weight="bold">2</text>
<text x="130" y="247" font-size="18" fill="#72695e" text-anchor="middle" font-weight="normal">n = 0</text>
<rect x="227" y="157" width="96" height="64" rx="9" fill="#526b86" fill-opacity=".1"/>
<text x="275" y="199" font-size="30" fill="#526b86" text-anchor="middle" font-weight="bold">3</text>
<text x="275" y="247" font-size="18" fill="#72695e" text-anchor="middle" font-weight="normal">n = 1</text>
<rect x="372" y="157" width="96" height="64" rx="9" fill="#526b86" fill-opacity=".1"/>
<text x="420" y="199" font-size="30" fill="#526b86" text-anchor="middle" font-weight="bold">6</text>
<text x="420" y="247" font-size="18" fill="#72695e" text-anchor="middle" font-weight="normal">n = 2</text>
<rect x="517" y="157" width="96" height="64" rx="9" fill="#526b86" fill-opacity=".1"/>
<text x="565" y="199" font-size="30" fill="#526b86" text-anchor="middle" font-weight="bold">6</text>
<text x="565" y="247" font-size="18" fill="#72695e" text-anchor="middle" font-weight="normal">n = 3</text>
<rect x="662" y="157" width="96" height="64" rx="9" fill="#b46638" fill-opacity=".1"/>
<text x="710" y="199" font-size="30" fill="#b46638" text-anchor="middle" font-weight="bold">5</text>
<text x="710" y="247" font-size="18" fill="#72695e" text-anchor="middle" font-weight="normal">n = 4</text>
<rect x="807" y="157" width="96" height="64" rx="9" fill="#b46638" fill-opacity=".1"/>
<text x="855" y="199" font-size="30" fill="#b46638" text-anchor="middle" font-weight="bold">2</text>
<text x="855" y="247" font-size="18" fill="#72695e" text-anchor="middle" font-weight="normal">n = 5</text>
<text x="690" y="365" font-size="22" fill="#14796f" text-anchor="start" font-weight="bold">循环输出 y_c</text>
<rect x="82" y="412" width="96" height="64" rx="9" fill="#14796f" fill-opacity=".1"/>
<text x="130" y="454" font-size="30" fill="#14796f" text-anchor="middle" font-weight="bold">7</text>
<text x="130" y="502" font-size="18" fill="#72695e" text-anchor="middle" font-weight="normal">n = 0</text>
<rect x="227" y="412" width="96" height="64" rx="9" fill="#14796f" fill-opacity=".1"/>
<text x="275" y="454" font-size="30" fill="#14796f" text-anchor="middle" font-weight="bold">5</text>
<text x="275" y="502" font-size="18" fill="#72695e" text-anchor="middle" font-weight="normal">n = 1</text>
<rect x="372" y="412" width="96" height="64" rx="9" fill="#14796f" fill-opacity=".1"/>
<text x="420" y="454" font-size="30" fill="#14796f" text-anchor="middle" font-weight="bold">6</text>
<text x="420" y="502" font-size="18" fill="#72695e" text-anchor="middle" font-weight="normal">n = 2</text>
<rect x="517" y="412" width="96" height="64" rx="9" fill="#14796f" fill-opacity=".1"/>
<text x="565" y="454" font-size="30" fill="#14796f" text-anchor="middle" font-weight="bold">6</text>
<text x="565" y="502" font-size="18" fill="#72695e" text-anchor="middle" font-weight="normal">n = 3</text>
<path d="M710 270 V303 H130 V400" fill="none" stroke="#b46638" stroke-width="2" marker-end="url(#arr)"/>
<text x="420.0" y="293" font-size="22" fill="#b46638" text-anchor="middle" font-weight="bold">+5</text>
<path d="M855 270 V346 H275 V400" fill="none" stroke="#b46638" stroke-width="2" marker-end="url(#arr)"/>
<text x="565.0" y="336" font-size="22" fill="#b46638" text-anchor="middle" font-weight="bold">+2</text>
<text x="690" y="435" font-size="20" fill="#14796f" text-anchor="start" font-weight="normal">n = 2、3 保持不变</text>
<text x="40" y="555" font-size="22" fill="#2c2825" text-anchor="start" font-weight="normal">y_c[n] = y_l[n] + y_l[n + 4]；一般情形还要加其他周期副本。</text>
</g></svg>