<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
<title id="title">重叠相加的全局输出对齐</title><desc id="desc">三个块的局部五点输出从全局编号0、3、6开始，逐列相加得到十点线性卷积。编号3、4、6、7有两个块叠加，编号10超出原记录所需长度。</desc>
<rect width="1100" height="570" rx="18" fill="#fffdf9"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#2c2825">
<text x="35" y="45" font-size="27" fill="#2c2825" text-anchor="start" font-weight="bold">重叠相加：沿同一条全局时间轴放回输出</text>
<text x="35" y="83" font-size="20" fill="#72695e" text-anchor="start" font-weight="normal">B = 3，Lh = 3；原输入长 8，完整输出取 n = 0 … 9</text>
<rect x="963" y="115" width="74" height="340" rx="8" fill="#eeeeeb"/>
<text x="200" y="145" font-size="20" fill="#72695e" text-anchor="middle" font-weight="normal">0</text>
<text x="280" y="145" font-size="20" fill="#72695e" text-anchor="middle" font-weight="normal">1</text>
<text x="360" y="145" font-size="20" fill="#72695e" text-anchor="middle" font-weight="normal">2</text>
<text x="440" y="145" font-size="20" fill="#72695e" text-anchor="middle" font-weight="normal">3</text>
<text x="520" y="145" font-size="20" fill="#72695e" text-anchor="middle" font-weight="normal">4</text>
<text x="600" y="145" font-size="20" fill="#72695e" text-anchor="middle" font-weight="normal">5</text>
<text x="680" y="145" font-size="20" fill="#72695e" text-anchor="middle" font-weight="normal">6</text>
<text x="760" y="145" font-size="20" fill="#72695e" text-anchor="middle" font-weight="normal">7</text>
<text x="840" y="145" font-size="20" fill="#72695e" text-anchor="middle" font-weight="normal">8</text>
<text x="920" y="145" font-size="20" fill="#72695e" text-anchor="middle" font-weight="normal">9</text>
<text x="1000" y="145" font-size="20" fill="#72695e" text-anchor="middle" font-weight="normal">10</text>
<text x="35" y="145" font-size="19" fill="#72695e" text-anchor="start" font-weight="normal">全局 n</text>
<text x="35" y="213" font-size="18" fill="#526b86" text-anchor="start" font-weight="normal">块 0：起点 0</text>
<rect x="170" y="180" width="60" height="50" rx="7" fill="#526b86" fill-opacity=".1"/>
<text x="200" y="213" font-size="23" fill="#526b86" text-anchor="middle" font-weight="bold">2</text>
<rect x="250" y="180" width="60" height="50" rx="7" fill="#526b86" fill-opacity=".1"/>
<text x="280" y="213" font-size="23" fill="#526b86" text-anchor="middle" font-weight="bold">2</text>
<rect x="330" y="180" width="60" height="50" rx="7" fill="#526b86" fill-opacity=".1"/>
<text x="360" y="213" font-size="23" fill="#526b86" text-anchor="middle" font-weight="bold">-1</text>
<rect x="410" y="180" width="60" height="50" rx="7" fill="#b46638" fill-opacity=".1"/>
<text x="440" y="213" font-size="23" fill="#b46638" text-anchor="middle" font-weight="bold">9</text>
<rect x="490" y="180" width="60" height="50" rx="7" fill="#b46638" fill-opacity=".1"/>
<text x="520" y="213" font-size="23" fill="#b46638" text-anchor="middle" font-weight="bold">-2</text>
<text x="35" y="288" font-size="18" fill="#526b86" text-anchor="start" font-weight="normal">块 1：起点 3</text>
<rect x="410" y="255" width="60" height="50" rx="7" fill="#b46638" fill-opacity=".1"/>
<text x="440" y="288" font-size="23" fill="#b46638" text-anchor="middle" font-weight="bold">3</text>
<rect x="490" y="255" width="60" height="50" rx="7" fill="#b46638" fill-opacity=".1"/>
<text x="520" y="288" font-size="23" fill="#b46638" text-anchor="middle" font-weight="bold">-2</text>
<rect x="570" y="255" width="60" height="50" rx="7" fill="#526b86" fill-opacity=".1"/>
<text x="600" y="288" font-size="23" fill="#526b86" text-anchor="middle" font-weight="bold">10</text>
<rect x="650" y="255" width="60" height="50" rx="7" fill="#b46638" fill-opacity=".1"/>
<text x="680" y="288" font-size="23" fill="#b46638" text-anchor="middle" font-weight="bold">-3</text>
<rect x="730" y="255" width="60" height="50" rx="7" fill="#b46638" fill-opacity=".1"/>
<text x="760" y="288" font-size="23" fill="#b46638" text-anchor="middle" font-weight="bold">10</text>
<text x="35" y="363" font-size="18" fill="#526b86" text-anchor="start" font-weight="normal">块 2：起点 6</text>
<rect x="650" y="330" width="60" height="50" rx="7" fill="#b46638" fill-opacity=".1"/>
<text x="680" y="363" font-size="23" fill="#b46638" text-anchor="middle" font-weight="bold">-2</text>
<rect x="730" y="330" width="60" height="50" rx="7" fill="#b46638" fill-opacity=".1"/>
<text x="760" y="363" font-size="23" fill="#b46638" text-anchor="middle" font-weight="bold">2</text>
<rect x="810" y="330" width="60" height="50" rx="7" fill="#526b86" fill-opacity=".1"/>
<text x="840" y="363" font-size="23" fill="#526b86" text-anchor="middle" font-weight="bold">-4</text>
<rect x="890" y="330" width="60" height="50" rx="7" fill="#526b86" fill-opacity=".1"/>
<text x="920" y="363" font-size="23" fill="#526b86" text-anchor="middle" font-weight="bold">0</text>
<rect x="970" y="330" width="60" height="50" rx="7" fill="#526b86" fill-opacity=".1"/>
<text x="1000" y="363" font-size="23" fill="#526b86" text-anchor="middle" font-weight="bold">0</text>
<line x1="35.00" y1="398.00" x2="1035.00" y2="398.00" stroke="#72695e" stroke-width="1.5" />
<text x="35" y="438" font-size="18" fill="#14796f" text-anchor="start" font-weight="bold">逐列求和 y[n]</text>
<text x="200" y="438" font-size="24" fill="#14796f" text-anchor="middle" font-weight="bold">2</text>
<text x="280" y="438" font-size="24" fill="#14796f" text-anchor="middle" font-weight="bold">2</text>
<text x="360" y="438" font-size="24" fill="#14796f" text-anchor="middle" font-weight="bold">-1</text>
<text x="440" y="438" font-size="24" fill="#14796f" text-anchor="middle" font-weight="bold">12</text>
<text x="520" y="438" font-size="24" fill="#14796f" text-anchor="middle" font-weight="bold">-4</text>
<text x="600" y="438" font-size="24" fill="#14796f" text-anchor="middle" font-weight="bold">10</text>
<text x="680" y="438" font-size="24" fill="#14796f" text-anchor="middle" font-weight="bold">-5</text>
<text x="760" y="438" font-size="24" fill="#14796f" text-anchor="middle" font-weight="bold">12</text>
<text x="840" y="438" font-size="24" fill="#14796f" text-anchor="middle" font-weight="bold">-4</text>
<text x="920" y="438" font-size="24" fill="#14796f" text-anchor="middle" font-weight="bold">0</text>
<text x="1000" y="438" font-size="18" fill="#72695e" text-anchor="middle" font-weight="normal">舍去</text>
<text x="35" y="493" font-size="21" fill="#2c2825" text-anchor="start" font-weight="normal">例如：y[3] = 9 + 3 = 12；y[6] = −3 − 2 = −5。</text>
<text x="35" y="533" font-size="20" fill="#72695e" text-anchor="start" font-weight="normal">空白表示该块不覆盖这里；先按编号相加，再按完整输出长度截取。</text>
</g></svg>