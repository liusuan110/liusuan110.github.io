<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
<title id="title">卷积：按相同输出编号，将三份响应相加</title><desc id="desc">输入在负一、零、一处为一、二、一。冲激响应在零、一处为一、负一。输出由 h[n+1]、2h[n] 和 h[n-1] 相加，得到编号负一到二处的一、一、负一、负一。</desc>
