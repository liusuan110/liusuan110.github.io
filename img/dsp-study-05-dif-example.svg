<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="775" viewBox="0 0 1100 775" role="img" aria-labelledby="title desc">
<title id="title">四点DIF的完整数值流图</title><desc id="desc">自然序输入2、1、3、4，第一级5、5、负1、3j，第二级10、0、负1加3j、负1减3j，频点顺序0、2、1、3。差后乘旋转因子展开为等价的支路权重。</desc>
<rect width="1100" height="775" rx="18" fill="#fffdf9"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#2c2825">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#72695e"/></marker></defs>
<text x="40" y="45" font-size="28" fill="#2c2825" text-anchor="start" font-weight="bold">四点 DIF：先前后配对，再做两个二点变换</text>
<text x="40" y="84" font-size="20" fill="#72695e" text-anchor="start" font-weight="normal">差后乘 W 的运算展开为支路权重；未标权重为 1，交叉处不相加。</text>
<text x="155" y="137" font-size="20" fill="#526b86" text-anchor="middle" font-weight="bold">自然序输入</text>
<text x="525" y="137" font-size="20" fill="#14796f" text-anchor="middle" font-weight="bold">第一级：和与旋转后的差</text>
<text x="890" y="137" font-size="20" fill="#b46638" text-anchor="middle" font-weight="bold">第二级：倒位序输出</text>
<line x1="245.00" y1="200.00" x2="431.00" y2="200.00" stroke="#72695e" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="245.00" y1="480.00" x2="431.00" y2="200.00" stroke="#72695e" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="245.00" y1="200.00" x2="431.00" y2="480.00" stroke="#72695e" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="245.00" y1="480.00" x2="431.00" y2="480.00" stroke="#72695e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="382.1" y="466.0" width="42" height="25" rx="5" fill="#fffdf9"/>
<text x="403.1" y="485.0" font-size="17" fill="#72695e" text-anchor="middle" font-weight="bold">−1</text>
<line x1="245.00" y1="340.00" x2="431.00" y2="340.00" stroke="#72695e" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="245.00" y1="620.00" x2="431.00" y2="340.00" stroke="#72695e" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="245.00" y1="340.00" x2="431.00" y2="620.00" stroke="#72695e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="357.91999999999996" y="527.6" width="42" height="25" rx="5" fill="#fffdf9"/>
<text x="378.91999999999996" y="546.6" font-size="17" fill="#72695e" text-anchor="middle" font-weight="bold">−j</text>
<line x1="245.00" y1="620.00" x2="431.00" y2="620.00" stroke="#72695e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="382.1" y="606.0" width="42" height="25" rx="5" fill="#fffdf9"/>
<text x="403.1" y="625.0" font-size="17" fill="#72695e" text-anchor="middle" font-weight="bold">+j</text>
<line x1="619.00" y1="200.00" x2="883.00" y2="200.00" stroke="#72695e" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="619.00" y1="340.00" x2="883.00" y2="200.00" stroke="#72695e" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="619.00" y1="200.00" x2="883.00" y2="340.00" stroke="#72695e" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="619.00" y1="340.00" x2="883.00" y2="340.00" stroke="#72695e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="817.12" y="326.0" width="42" height="25" rx="5" fill="#fffdf9"/>
<text x="838.12" y="345.0" font-size="17" fill="#72695e" text-anchor="middle" font-weight="bold">−1</text>
<line x1="619.00" y1="480.00" x2="883.00" y2="480.00" stroke="#72695e" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="619.00" y1="620.00" x2="883.00" y2="480.00" stroke="#72695e" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="619.00" y1="480.00" x2="883.00" y2="620.00" stroke="#72695e" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="619.00" y1="620.00" x2="883.00" y2="620.00" stroke="#72695e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="817.12" y="606.0" width="42" height="25" rx="5" fill="#fffdf9"/>
<text x="838.12" y="625.0" font-size="17" fill="#72695e" text-anchor="middle" font-weight="bold">−1</text>
<rect x="65" y="175" width="180" height="50" rx="8" fill="#e5f1ed" stroke="#d4e7df"/>
<text x="155" y="207" font-size="21" fill="#2c2825" text-anchor="middle" font-weight="bold">x₀ = 2</text>
<rect x="65" y="315" width="180" height="50" rx="8" fill="#e5f1ed" stroke="#d4e7df"/>
<text x="155" y="347" font-size="21" fill="#2c2825" text-anchor="middle" font-weight="bold">x₁ = 1</text>
<rect x="65" y="455" width="180" height="50" rx="8" fill="#e5f1ed" stroke="#d4e7df"/>
<text x="155" y="487" font-size="21" fill="#2c2825" text-anchor="middle" font-weight="bold">x₂ = 3</text>
<rect x="65" y="595" width="180" height="50" rx="8" fill="#e5f1ed" stroke="#d4e7df"/>
<text x="155" y="627" font-size="21" fill="#2c2825" text-anchor="middle" font-weight="bold">x₃ = 4</text>
<rect x="435" y="175" width="180" height="50" rx="8" fill="#e5f1ed" stroke="#d4e7df"/>
<text x="525" y="207" font-size="21" fill="#2c2825" text-anchor="middle" font-weight="bold">a₀ = 5</text>
<rect x="435" y="315" width="180" height="50" rx="8" fill="#e5f1ed" stroke="#d4e7df"/>
<text x="525" y="347" font-size="21" fill="#2c2825" text-anchor="middle" font-weight="bold">a₁ = 5</text>
<rect x="435" y="455" width="180" height="50" rx="8" fill="#e5f1ed" stroke="#d4e7df"/>
<text x="525" y="487" font-size="21" fill="#2c2825" text-anchor="middle" font-weight="bold">b₀ = −1</text>
<rect x="435" y="595" width="180" height="50" rx="8" fill="#e5f1ed" stroke="#d4e7df"/>
<text x="525" y="627" font-size="21" fill="#2c2825" text-anchor="middle" font-weight="bold">b₁ = 3j</text>
<circle cx="890" cy="200" r="5" fill="#2c2825"/>
<text x="908" y="208" font-size="21" fill="#2c2825" text-anchor="start" font-weight="bold">X₀ = 10</text>
<circle cx="890" cy="340" r="5" fill="#2c2825"/>
<text x="908" y="348" font-size="21" fill="#2c2825" text-anchor="start" font-weight="bold">X₂ = 0</text>
<circle cx="890" cy="480" r="5" fill="#2c2825"/>
<text x="908" y="488" font-size="21" fill="#2c2825" text-anchor="start" font-weight="bold">X₁ = −1 + 3j</text>
<circle cx="890" cy="620" r="5" fill="#2c2825"/>
<text x="908" y="628" font-size="21" fill="#2c2825" text-anchor="start" font-weight="bold">X₃ = −1 − 3j</text>
<text x="40" y="697" font-size="21" fill="#2c2825" text-anchor="start" font-weight="normal">第一级第四行：−j × 1 + j × 4 = 3j = (x₁ − x₃)W₄¹。</text>
<text x="40" y="737" font-size="21" fill="#72695e" text-anchor="start" font-weight="normal">自然序答案：[10, −1 + 3j, 0, −1 − 3j]；图中第二行是 X₂。</text>
</g></svg>