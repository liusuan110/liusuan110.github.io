<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="635" viewBox="0 0 1000 635" role="img" aria-labelledby="title desc">
<title id="title">从极零点与 ROC 判断因果系统的稳定性</title><desc id="desc">例3-5的系统函数在四分之一和二分之一处有极点，在零和负四分之一处有零点。取因果ROC为半径二分之一的圆外，绿色区域包含虚线单位圆，系统BIBO稳定。原点零点来自改写为关于z的有理式。</desc>
<rect width="1000" height="635" rx="18" fill="#fffdf9"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#2c2825">
<text x="40" y="45" font-size="28" fill="#2c2825" text-anchor="start" font-weight="bold">从极零点与 ROC 判断因果系统的稳定性</text>
<text x="40" y="82" font-size="22" fill="#72695e" text-anchor="start" font-weight="normal">H(z) = z(z + 0.25) / [(z − 0.5)(z − 0.25)]</text>
<rect x="58" y="116" width="460" height="456" rx="12" fill="#dfede6"/>
<circle cx="288" cy="342" r="85.0" stroke="none" fill="#fffdf9" stroke-width="0" stroke-dasharray=""/>
<line x1="77.00" y1="342.00" x2="500.00" y2="342.00" stroke="#aaa092" stroke-width="1.4" />
<line x1="288.00" y1="136.00" x2="288.00" y2="551.00" stroke="#aaa092" stroke-width="1.4" />
<circle cx="288" cy="342" r="170" stroke="#526b86" fill="none" stroke-width="2.2" stroke-dasharray="7 6"/>
<circle cx="288" cy="342" r="85.0" stroke="#b46638" fill="none" stroke-width="1.7" stroke-dasharray=""/>
<text x="490" y="329" font-size="18" fill="#72695e" text-anchor="end" font-weight="normal">Re(z)</text>
<text x="300" y="144" font-size="18" fill="#72695e" text-anchor="start" font-weight="normal">Im(z)</text>
<line x1="118.00" y1="337.00" x2="118.00" y2="347.00" stroke="#72695e" stroke-width="1" />
<text x="118" y="367" font-size="17" fill="#72695e" text-anchor="middle" font-weight="normal">-1</text>
<line x1="458.00" y1="337.00" x2="458.00" y2="347.00" stroke="#72695e" stroke-width="1" />
<text x="458" y="367" font-size="17" fill="#72695e" text-anchor="middle" font-weight="normal">1</text>
<circle cx="288" cy="342" r="7" stroke="#14796f" fill="#fffdf9" stroke-width="2.5" stroke-dasharray=""/>
<line x1="288.00" y1="353.00" x2="288.00" y2="380.00" stroke="#14796f" stroke-width="1.2" />
<text x="288" y="403" font-size="17" fill="#14796f" text-anchor="middle" font-weight="normal">0</text>
<circle cx="245.5" cy="342" r="7" stroke="#14796f" fill="#fffdf9" stroke-width="2.5" stroke-dasharray=""/>
<line x1="245.50" y1="353.00" x2="245.50" y2="380.00" stroke="#14796f" stroke-width="1.2" />
<text x="245.5" y="403" font-size="17" fill="#14796f" text-anchor="middle" font-weight="normal">−0.25</text>
<line x1="323.50" y1="335.00" x2="337.50" y2="349.00" stroke="#b46638" stroke-width="3" />
<line x1="323.50" y1="349.00" x2="337.50" y2="335.00" stroke="#b46638" stroke-width="3" />
<line x1="330.50" y1="330.00" x2="330.50" y2="304.00" stroke="#b46638" stroke-width="1.2" />
<text x="330.5" y="293" font-size="17" fill="#b46638" text-anchor="middle" font-weight="normal">0.25</text>
<line x1="366.00" y1="335.00" x2="380.00" y2="349.00" stroke="#b46638" stroke-width="3" />
<line x1="366.00" y1="349.00" x2="380.00" y2="335.00" stroke="#b46638" stroke-width="3" />
<line x1="373.00" y1="330.00" x2="373.00" y2="304.00" stroke="#b46638" stroke-width="1.2" />
<text x="373.0" y="293" font-size="17" fill="#b46638" text-anchor="middle" font-weight="normal">0.5</text>
<text x="550" y="156" font-size="23" fill="#2c2825" text-anchor="start" font-weight="bold">01  因果性选择圆外 ROC</text>
<text x="550" y="194" font-size="22" fill="#14796f" text-anchor="start" font-weight="normal">|z| &gt; 0.5，且 H(∞) = 1</text>
<text x="550" y="251" font-size="23" fill="#2c2825" text-anchor="start" font-weight="bold">02  单位圆完全落在 ROC 内</text>
<text x="550" y="289" font-size="21" fill="#14796f" text-anchor="start" font-weight="normal">冲激响应绝对可和，系统稳定</text>
<text x="550" y="347" font-size="23" fill="#2c2825" text-anchor="start" font-weight="bold">03  两个极点产生两项指数</text>
<text x="550" y="385" font-size="21" fill="#526b86" text-anchor="start" font-weight="normal">h[n] = [3(0.5)ⁿ − 2(0.25)ⁿ]u[n]</text>
<text x="550" y="438" font-size="21" fill="#14796f" text-anchor="start" font-weight="normal">○  零点：0，−0.25</text>
<text x="550" y="475" font-size="21" fill="#b46638" text-anchor="start" font-weight="normal">×  极点：0.25，0.5</text>
<text x="550" y="512" font-size="20" fill="#72695e" text-anchor="start" font-weight="normal">虚线：单位圆；绿色：ROC</text>
<text x="550" y="549" font-size="19" fill="#72695e" text-anchor="start" font-weight="normal">有限圆形边界 |z| = 0.5 不属于 ROC</text>
<text x="500" y="607" font-size="19" fill="#2c2825" text-anchor="middle" font-weight="normal">先约分并画极零点，再结合因果性确定 ROC；不要用输出 Y(z) 的 ROC 代替系统判据。</text>
</g></svg>